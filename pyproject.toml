[project]
name = "feature-voting-portal"
version = "0.1.0"
description = "AI-governed community feature voting portal — backend API + orchestration daemon/services."
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.110",
    "uvicorn[standard]>=0.29",
    "redis>=5.0",
    "supabase>=2.4",
    "openai>=1.30",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.0",
]

# Console scripts used in the execution playbook (run order, steps 3–4):
#   uv run --env-file .env ingestion-service
#   uv run --env-file .env sprint-service
[project.scripts]
ingestion-service = "orchestrator.ingestion_service:main"
sprint-service = "orchestrator.sprint_service:main"

# Test deps (pdd-generated unit tests): pytest + async + fakeredis.
#   uv run --group dev pytest
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "fakeredis>=2.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The two Python packages pdd generates into (frontend is a separate Vite app).
# `backend/` and `orchestrator/` are import packages of THIS project, not
# separate distributions: the source imports them as `backend.*` /
# `orchestrator.*`, which only resolves if the repo root is the project root.
# Do not add a pyproject.toml inside either directory — that would make the
# directory its own project root and the packages would install as top-level
# modules (`main`, `contracts`, `routes`), breaking every absolute import.
[tool.hatch.build.targets.wheel]
packages = ["backend", "orchestrator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
