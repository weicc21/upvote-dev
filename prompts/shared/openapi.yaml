# FROZEN ASSET — the executable API contract between forum frontend and backend.
# Referenced by prompts/shared/contracts.prompt; compile targets conform to this
# file, and it is never regenerated by a compiler.
# Wire format is snake_case throughout — matching Postgres columns and Supabase
# Realtime payloads, so REST bodies and Realtime rows share one shape.
openapi: 3.1.0
info:
  title: upvote-dev Forum Backend API
  version: 0.1.0

paths:
  /api/features:
    get:
      summary: List features by view
      parameters:
        - { name: view, in: query, required: true, schema: { enum: [pipeline, shipped, holding, vault] } }
        - { name: sort, in: query, schema: { enum: [top, new], default: top } }
        - { name: q, in: query, schema: { type: string }, description: Vault search only }
        - { name: status, in: query, schema: { type: string }, description: CSV of canonical enum values (pipeline view only); unknown value -> 400 }
        - { name: cursor, in: query, schema: { type: string }, description: Opaque keyset cursor from a previous response }
        - { name: limit, in: query, schema: { type: integer, default: 30, maximum: 100 } }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [features]
                properties:
                  features: { type: array, items: { $ref: "#/components/schemas/Feature" } }
                  next_cursor: { type: [string, "null"], description: Absent/null on last page }
        "400": { $ref: "#/components/responses/Error" }
    post:
      summary: Pitch a feature (validation gate; no persistence — 202 + screening)
      security: [{ supabaseJwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, description]
              properties:
                title: { type: string, minLength: 1, maxLength: 60 }
                description: { type: string, minLength: 30, maxLength: 300 }
      responses:
        "202":
          content:
            application/json:
              schema:
                type: object
                required: [feature_id, state]
                properties:
                  feature_id: { type: string, format: uuid }
                  state: { const: screening }
        "400": { $ref: "#/components/responses/Error" }
        "429":
          description: Out of Pitch Coins (5/day)
          content:
            application/json:
              schema:
                type: object
                required: [error, resets_at]
                properties:
                  error: { $ref: "#/components/schemas/ErrorBody" }
                  resets_at: { type: string, format: date-time, description: When the daily coin window refills — drives the frontend countdown }

  /api/features/{id}:
    get:
      summary: Single feature with children and viewer vote state
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/Feature" } } } }
        "404": { $ref: "#/components/responses/Error" }

  /api/features/mine:
    get:
      summary: The caller's own pitches — Redis pending records + persisted rows (two separate reads)
      security: [{ supabaseJwt: [] }]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [pending, features]
                properties:
                  pending: { type: array, items: { $ref: "#/components/schemas/PendingPitch" } }
                  features: { type: array, items: { $ref: "#/components/schemas/Feature" } }

  /api/features/{id}/upvote:
    post:
      summary: One vote per user, VOTING rows only
      security: [{ supabaseJwt: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [feature_id, upvotes]
                properties:
                  feature_id: { type: string, format: uuid }
                  upvotes: { type: integer }
        "409": { $ref: "#/components/responses/Error" }   # error.code = "already_voted"
        "422": { $ref: "#/components/responses/Error" }   # error.code = "not_votable" (status is not VOTING)

  /api/features/{id}/reboot:
    post:
      summary: ARCHIVED -> VOTING; resets created_at and upvotes to 1; no re-enqueue
      security: [{ supabaseJwt: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/Feature" } } } }
        "422": { $ref: "#/components/responses/Error" }   # error.code = "not_archived"

  /api/broadcast:
    get:
      summary: Recent ticker events for hydration (live updates via Supabase Realtime)
      description: >
        Hydration read ONLY — returns the most recent broadcast_events rows to fill
        the ticker on initial load / reconnect. Live updates do NOT come from this
        endpoint; the frontend subscribes to Supabase Realtime on the broadcast_events
        table. Provenance: rows originate in the orchestrator, which publishes
        human-readable micro-copy to the Redis agent_events channel; the backend
        event_relay task persists each event VERBATIM into broadcast_events (it never
        authors or rewrites ticker copy). Lossy by design — pub/sub has no replay, so a
        relay outage drops events; this hydration read is how a client recovers them.
      parameters: [{ name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events: { type: array, items: { $ref: "#/components/schemas/BroadcastEvent" } }

  /api/sandbox:
    get:
      summary: Latest deployment for the iframe embed (allowlist-validated; cacheable ~30s)
      responses:
        "200":
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [status, preview_url, version, deployed_at]
                    properties:
                      status: { const: live }
                      preview_url: { type: string, format: uri }
                      version: { type: string }
                      deployed_at: { type: string, format: date-time }
                  - type: object
                    required: [status]
                    properties:
                      status: { const: none }
                      preview_url: { type: [string, "null"], description: Bootstrap SANDBOX_URL when configured }

  /webhooks/render:
    post:
      summary: Render deploy webhook (shared-secret auth; excluded from CORS)
      security: [{ webhookSecret: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event, render_deploy_id, version, feature_ids]
              properties:
                event: { enum: [deploy_live, deploy_failed] }
                render_deploy_id: { type: string }
                version: { type: string }
                preview_url: { type: string, format: uri, description: Required on deploy_live; must match SANDBOX_ALLOWED_HOSTS }
                feature_ids: { type: array, items: { type: string, format: uuid } }
      responses:
        "204": { description: Accepted }
        "401": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    supabaseJwt: { type: http, scheme: bearer, description: "Supabase Auth JWT (reads are public; writes require it). Satisfied by a Supabase anonymous-auth session (signInAnonymously) as well as a real one — pitching requires no signup/login ceremony, only a resolvable caller id. DEV_MODE=true replaces this with an X-Dev-User UUID header and skips verification — local/hackathon only, never production." }
    webhookSecret: { type: apiKey, in: header, name: X-Webhook-Secret }

  responses:
    Error:
      description: Error envelope — error.message is friendly, verbatim-displayable copy
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { $ref: "#/components/schemas/ErrorBody" }

  schemas:
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code: { type: string, description: Machine-readable, e.g. already_voted | not_votable | not_archived | out_of_coins | validation_failed }
        message: { type: string, description: Friendly copy the frontend may display verbatim }

    Feature:
      type: object
      required: [id, title, description, status, upvotes, created_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, maxLength: 60 }
        description: { type: string, maxLength: 300 }
        status: { enum: [VOTING, CONSOLIDATING, IN_SPRINT, SPLIT, COMPILED, POSTPONED_CONFLICT, ARCHIVED] }
        upvotes: { type: integer }
        author_handle: { type: [string, "null"], description: Display name; never the auth id }
        parent_id: { type: [string, "null"], format: uuid }
        split_depth: { type: integer, default: 0 }
        unlock_threshold: { type: [integer, "null"], description: Set on split children; UI renders progress toward it. Load-bearing, not display-only — this is the row's actual sprint-eligibility vote bar (falls back to SPRINT_VOTE_THRESHOLD when null) }
        extends_id: { type: [string, "null"], format: uuid, description: Shipped base feature this one builds on }
        extends_title: { type: [string, "null"], description: Denormalized base title for the "builds on" chip }
        postpone_count: { type: integer, default: 0 }
        ai_explanation: { type: [string, "null"], description: Holding Pattern explanation }
        merge_count: { type: [integer, "null"], description: Matching requests found (CONSOLIDATING display) }
        shipped_version: { type: [string, "null"], description: From deployments join; COMPILED rows only }
        shipped_at: { type: [string, "null"], format: date-time }
        viewer_has_voted: { type: boolean, description: Whether the requesting user (if authed) already voted }
        children: { type: array, items: { $ref: "#/components/schemas/Feature" }, description: Present on SPLIT parents }
        created_at: { type: string, format: date-time }
        updated_at: { type: [string, "null"], format: date-time }

    PendingPitch:
      type: object
      required: [feature_id, title, state, submitted_at]
      properties:
        feature_id: { type: string, format: uuid }
        title: { type: string }
        state: { enum: [screening, rejected, merged] }
        reason: { type: [string, "null"], enum: [security, off_topic, unclear, already_shipped, null], description: Set when state=rejected }
        shipped_version: { type: [string, "null"], description: Set when reason=already_shipped }
        merged_into_feature_id: { type: [string, "null"], format: uuid, description: Set when state=merged — the canonical feature this pitch's vote was folded into }
        merged_into_title: { type: [string, "null"], description: Denormalized canonical title, set when state=merged, so the tray can render a link with no extra fetch }
        submitted_at: { type: string, format: date-time }

    BroadcastEvent:
      type: object
      required: [id, phase, agent_name, message, created_at]
      properties:
        id: { type: string, format: uuid }
        phase: { enum: [screening, synthesizing, architecting, compiling, deployed] }
        agent_name: { type: string }
        message: { type: string }
        created_at: { type: string, format: date-time }
